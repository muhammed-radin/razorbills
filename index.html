<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="%STORE_FAVICON%" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>%STORE_TITLE%</title>

    <meta name="description" content="%STORE_DESCRIPTION%" />
    <meta name="keywords" content="%STORE_KEYWORDS%" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="%STORE_URL%" />
    <!-- Google Site Verification -->
    <meta
      name="google-site-verification"
      content="%STORE_GOOGLE_VERIFICATION%"
    />

    <!-- Open Graph Metadata (Facebook, WhatsApp, LinkedIn, etc.) -->
    <meta property="og:title" content="%STORE_TITLE%" />
    <meta property="og:description" content="%STORE_DESCRIPTION%" />
    <meta property="og:image" content="%STORE_OG_IMAGE%" />
    <meta property="og:url" content="%STORE_URL%" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="%STORE_NAME%" />

    <!-- Twitter Card Metadata -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="%STORE_TITLE%" />
    <meta name="twitter:description" content="%STORE_DESCRIPTION%" />
    <meta name="twitter:image" content="%STORE_OG_IMAGE%" />

    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="%STORE_APPLE_TOUCH_ICON%"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="%STORE_FAVICON_32%"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="%STORE_FAVICON_16%"
    />
    <link rel="manifest" href="%STORE_MANIFEST%" />

    <meta name="theme-color" content="%STORE_THEME_COLOR%" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Bakbak+One&family=Outfit:wght@100..900&display=swap"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Bakbak+One&family=Outfit:wght@100..900&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media = 'all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Bakbak+One&family=Outfit:wght@100..900&display=swap"
        rel="stylesheet"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
