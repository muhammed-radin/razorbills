    <style>
      /* Inline splash so the browser paints instantly (First Contentful
       * Paint) while the JS bundle downloads/parses. React removes it on
       * mount — see src/main.jsx. */
      #app-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #ffffff;
        z-index: 9999;
      }
      #app-splash .logo {
        width: 104px;
        height: 104px;
        overflow: visible;
      }
      #app-splash .logo .svg-elem-1,
      #app-splash .logo .svg-elem-2,
      #app-splash .logo .svg-elem-3,
      #app-splash .logo .svg-elem-4,
      #app-splash .logo .svg-elem-5 {
        stroke: #000;
        stroke-dasharray: 1000;
        stroke-dashoffset: 1000;
        animation: app-splash-logo-draw 4s
          cubic-bezier(0.47, 0, 0.745, 0.715) 1.5s infinite;
      }
      #app-splash .logo .svg-elem-1 {
        fill: transparent;
        animation-delay: 1.5s;
      }
      #app-splash .logo .svg-elem-2,
      #app-splash .logo .svg-elem-3,
      #app-splash .logo .svg-elem-4,
      #app-splash .logo .svg-elem-5 {
        fill: transparent;
      }
      #app-splash .logo .svg-elem-2 {
        animation-delay: 1.62s;
      }
      #app-splash .logo .svg-elem-3 {
        animation-delay: 1.74s;
      }
      #app-splash .logo .svg-elem-4 {
        animation-delay: 1.86s;
      }
      #app-splash .logo .svg-elem-5 {
        animation-delay: 1.98s;
      }
      #app-splash .logo .svg-elem-1 {
        --logo-fill: rgb(0, 0, 0);
      }
      #app-splash .logo .svg-elem-2,
      #app-splash .logo .svg-elem-3,
      #app-splash .logo .svg-elem-4,
      #app-splash .logo .svg-elem-5 {
        --logo-fill: rgb(255, 255, 255);
      }
      #app-splash .app-splash__text {
        font: 500 14px/1.2 system-ui, -apple-system, "Segoe UI", Roboto,
          sans-serif;
        margin: 0;
        color: rgba(15, 23, 42, 0.7);
        background: linear-gradient(
          90deg,
          rgba(15, 23, 42, 0.45) 0%,
          rgba(15, 23, 42, 0.45) 35%,
          rgba(15, 23, 42, 0.95) 50%,
          rgba(15, 23, 42, 0.45) 65%,
          rgba(15, 23, 42, 0.45) 100%
        );
        background-size: 250% 100%;
        background-position: 100% 0;
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        letter-spacing: 0.02em;
        animation: app-splash-text-shimmer 2.4s ease-in-out 1.5s infinite;
      }
      @keyframes app-splash-logo-draw {
        0%,
        12% {
          stroke-dashoffset: 1000;
          fill: transparent;
        }
        40%,
        72% {
          stroke-dashoffset: 0;
          fill: var(--logo-fill);
        }
        100% {
          stroke-dashoffset: 1000;
          fill: transparent;
        }
      }
      @keyframes app-splash-text-shimmer {
        0%,
        35% {
          background-position: 100% 0;
        }
        70%,
        100% {
          background-position: -100% 0;
        }
      }
      @media (prefers-color-scheme: dark) {
        #app-splash {
          background: #0a0a0a;
        }
        #app-splash .app-splash__text {
          color: rgba(255, 255, 255, 0.75);
          background-image: linear-gradient(
            90deg,
            rgba(255, 255, 255, 0.5) 0%,
            rgba(255, 255, 255, 0.5) 35%,
            rgba(255, 255, 255, 1) 50%,
            rgba(255, 255, 255, 0.5) 65%,
            rgba(255, 255, 255, 0.5) 100%
          );
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #app-splash .logo .svg-elem-1,
        #app-splash .logo .svg-elem-2,
        #app-splash .logo .svg-elem-3,
        #app-splash .logo .svg-elem-4,
        #app-splash .logo .svg-elem-5 {
          stroke-dashoffset: 0;
          fill: var(--logo-fill);
          animation: none;
        }
        #app-splash .app-splash__text {
          animation: none;
          background-position: 50% 0;
        }
      }
    </style>
  </head>
